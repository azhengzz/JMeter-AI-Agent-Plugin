component:
  type: httpsampler
  aliases: [httptestsample, httprequest]
  name: HTTP Request
  testClass: org.apache.jmeter.protocol.http.sampler.HTTPSamplerProxy
  guiClass: org.apache.jmeter.protocol.http.control.gui.HttpTestSampleGui
  description: Sends HTTP/HTTPS requests to web servers

properties:
  - name: HTTPSampler.protocol
    type: String
    required: false
    enum: ["http", "https", "file"]
    description: Protocol - http, https, or file

  - name: HTTPSampler.domain
    type: String
    required: false
    description: Domain name or IP address

  - name: HTTPSampler.port
    type: Integer
    required: false
    min: 1
    max: 65535
    description: Port number

  - name: HTTPSampler.path
    type: String
    required: false
    description: Resource path

  - name: HTTPSampler.method
    type: String
    required: false
    enum: ["GET", "POST", "PUT", "DELETE", "HEAD", "OPTIONS", "PATCH", "TRACE"]
    default: "GET"
    description: HTTP method

  - name: HTTPSampler.contentEncoding
    type: String
    required: false
    description: Content encoding for POST/PUT/PATCH

  - name: HTTPSampler.implementation
    type: String
    required: false
    enum: ["HttpClient4", "Java"]
    default: "HttpClient4"
    description: HTTP client implementation - "HttpClient4" (Apache HttpComponents HttpClient 4.x) or "Java" (JVM built-in HttpURLConnection). Empty falls back to jmeter.httpsampler property or HTTP Request Defaults.

  - name: HTTPSampler.connect_timeout
    type: Integer
    required: false
    min: 0
    description: Connection timeout in milliseconds

  - name: HTTPSampler.response_timeout
    type: Integer
    required: false
    min: 0
    description: Response timeout in milliseconds

  - name: HTTPSampler.image_parser
    type: Boolean
    required: false
    default: false
    description: Retrieve all embedded resources from HTML files (images, stylesheets, scripts, frames, etc.)

  - name: HTTPSampler.concurrentDwn
    type: Boolean
    required: false
    default: false
    description: Download embedded resources concurrently (only effective when image_parser is true)

  - name: HTTPSampler.concurrentPool
    type: Integer
    required: false
    min: 1
    default: 6
    description: Pool size for concurrent embedded resource downloads

  - name: HTTPSampler.embedded_url_re
    type: String
    required: false
    description: Regex - only embedded URLs matching this expression are downloaded. Empty means all embedded resources are downloaded

  - name: HTTPSampler.embedded_url_exclude_re
    type: String
    required: false
    description: Regex - embedded URLs matching this expression are NOT downloaded. Takes precedence over embedded_url_re

  - name: HTTPSampler.ipSourceType
    type: Integer
    required: false
    min: 0
    max: 3
    default: 0
    description: Source address type - 0 (Hostname), 1 (Device), 2 (Device IPv4), 3 (Device IPv6). Determines how ipSource is interpreted

  - name: HTTPSampler.ipSource
    type: String
    required: false
    description: Source IP address, device name or interface name to bind the request to (interpretation depends on ipSourceType)

  - name: HTTPSampler.proxyScheme
    type: String
    required: false
    description: Proxy server scheme (e.g. "http", "https"). Empty uses default http

  - name: HTTPSampler.proxyHost
    type: String
    required: false
    description: Proxy server hostname

  - name: HTTPSampler.proxyPort
    type: Integer
    required: false
    min: 1
    max: 65535
    description: Proxy server port

  - name: HTTPSampler.proxyUser
    type: String
    required: false
    description: Proxy server login username

  - name: HTTPSampler.proxyPass
    type: String
    required: false
    description: Proxy server login password

  - name: HTTPSampler.follow_redirects
    type: Boolean
    required: false
    default: true
    description: Follow redirects

  - name: HTTPSampler.auto_redirects
    type: Boolean
    required: false
    description: Auto-follow redirects at protocol level

  - name: HTTPSampler.use_keepalive
    type: Boolean
    required: false
    default: true
    description: Use keep-alive connections

  - name: HTTPSampler.DO_MULTIPART_POST
    type: Boolean
    required: false
    # default: false
    description: Use multipart/form-data for POST

  - name: HTTPSampler.BROWSER_COMPATIBLE_MULTIPART
    type: Boolean
    required: false
    default: false
    description: Browser-compatible multipart mode - omits Content-Transfer-Encoding and Charset headers on parts. Enable when the server rejects standard multipart headers

  - name: HTTPSampler.postBodyRaw
    type: Boolean
    required: false
    default: false
    description: Send raw body content

  - name: HTTPSampler.md5
    type: Boolean
    required: false
    default: false
    description: Save response as MD5 hash instead of storing the full response body

  - name: HTTPsampler.Arguments
    type: Array
    testClass: org.apache.jmeter.config.Arguments
    mountMode: TestElementProperty
    containerAddMethod: addArgument
    required: false
    description: HTTP request arguments/parameters as an array of HTTPArgument objects.
    itemClass: org.apache.jmeter.protocol.http.util.HTTPArgument
    itemProperties:
      - name: Argument.name
        type: String
        required: false
        default: ""
        description: Parameter name. Required for parameter mode, omit for postBodyRaw mode.

      - name: Argument.value
        type: String
        required: true
        description: Parameter value

      - name: HTTPArgument.use_equals
        type: Boolean
        required: false
        default: true
        description: Whether to use '=' between name and value

      - name: HTTPArgument.always_encode
        type: Boolean
        required: false
        default: false
        setterOverride: setAlwaysEncoded
        description: Whether to always URL-encode the parameter

      - name: Argument.metadata
        type: String
        required: false
        default: "="
        setterOverride: setMetaData
        description: Metadata character (typically '=')

      - name: HTTPArgument.content_type
        type: String
        required: false
        default: "text/plain"
        description: Content type for the parameter

  - name: HTTPsampler.Files
    type: Array
    testClass: org.apache.jmeter.protocol.http.util.HTTPFileArgs
    mountMode: TestElementProperty
    containerAddMethod: addHTTPFileArg
    required: false
    description: File upload parameters for multipart/form-data requests
    itemClass: org.apache.jmeter.protocol.http.util.HTTPFileArg
    itemProperties:
      - name: File.path
        type: String
        required: true
        description: File path to upload

      - name: File.paramname
        type: String
        required: true
        setterOverride: setParamName
        description: HTTP parameter name for the file upload

      - name: File.mimetype
        type: String
        required: false
        default: "application/octet-stream"
        setterOverride: setMimeType
        description: MIME type of the file
